services:
  # Private Ollama service with persistent model storage.
  - type: pserv
    name: csi-vegas-ollama
    env: docker
    dockerfilePath: ./ollama/Dockerfile
    disk:
      name: ollama-data
      mountPath: /root/.ollama
      sizeGB: 20
    envVars:
      - key: OLLAMA_MODEL
        value: llama3.2:1b

  # FastAPI backend exposed publicly.
  - type: web
    name: csi-vegas-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: OLLAMA_BASE_URL
        value: http://csi-vegas-ollama:11434
      - key: OLLAMA_MODEL
        value: llama3.2:1b
