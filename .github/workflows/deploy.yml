name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Fix permissions
        working-directory: frontend
        run: chmod +x node_modules/.bin/vite

      - name: Write API base for GitHub Pages
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          node -e "const fs=require('fs'); const u=(process.env.VITE_API_URL||'').trim(); const api=u||'https://csi-vegas.onrender.com'; fs.mkdirSync('public',{recursive:true}); fs.writeFileSync('public/api-config.json', JSON.stringify({apiBaseUrl: api}, null, 2));"

      - name: Build the project
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/dist